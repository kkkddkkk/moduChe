<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>이메일 인증</title>
</head>
<body
	style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f4f4;">
	<table width="100%" cellpadding="0" cellspacing="0" border="0"
		bgcolor="#f4f4f4">
		<tr>
			<td align="center">
				<!-- Container -->
				<table width="600" cellpadding="0" cellspacing="0" border="0"
					style="background-color: #ffffff; border-radius: 12px;">

					<tr>
						<td align="center" style="padding: 20px 0;">
							<table align="center" cellpadding="0" cellspacing="0" border="0">
								<tr>
									<td align="center"><img src="cid:logo" alt="로고"
										style="height: 50px; display: block;"></td>
								</tr>
							</table>
						</td>
					</tr>
					<!-- Content (Centered) -->
					<tr>
						<td align="center" style="padding: 20px 0; color: #333333;">
							<p style="font-size: 16px; margin: 0;">아래 인증번호를 회원가입 페이지에
								입력해주세요.</p>
						</td>
					</tr>

					<tr>
						<td align="center" style="padding: 10px 0;">
							<table align="center" cellpadding="0" cellspacing="0" border="0"
								style="border: 2px solid #004288ff; border-radius: 12px; background-color: #e6f0ff; width: 300px;">
								<tr>
									<td align="center"
										style="font-size: 32px; font-weight: bold; color: #004288ff; letter-spacing: 4px; padding: 20px;">
										[[${code}]]</td>
								</tr>
							</table>
						</td>
					</tr>

					<tr>
						<td align="center" style="padding: 20px 0; color: #333333;">
							<p style="font-size: 14px; margin: 0;">* 인증 번호는 전송으로부터 5분간
								유효합니다.</p>
						</td>
					</tr>

					<!-- Footer -->
					<tr>
						<td
							style="background-color: #029cdeff; color: white; text-align: center; padding: 15px 10px; font-size: 14px;">
							© 2025 모두의 체육관. 문의: <a href="mailto:support@moduche.com"
							style="color: white; text-decoration: underline;">support@moduche.com</a>
						</td>
					</tr>

				</table>
			</td>
		</tr>
	</table>
</body>
</html>
